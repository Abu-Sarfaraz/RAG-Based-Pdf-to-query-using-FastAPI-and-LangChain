# Deploy through Docker so the preloaded CPU embedding model is included.
# The paid backend and disk keep documents/chat history across restarts.
services:
  - type: web
    name: papertrail-backend
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    plan: standard
    healthCheckPath: /health
    disk:
      name: papertrail-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: CHAT_API_KEY
        sync: false
      - key: LLM_MODEL
        value: llama-3.3-70b-versatile
      - key: DATA_DIR
        value: /data
      - key: HF_HUB_OFFLINE
        value: "1"
  - type: web
    name: papertrail-frontend
    runtime: docker
    rootDir: frontend
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /_stcore/health
    envVars:
      - key: BACKEND_URL
        sync: false
