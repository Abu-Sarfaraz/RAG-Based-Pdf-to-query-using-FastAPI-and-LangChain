services:
  - type: web
    name: rag-backend
    runtime: python
    plan: free           # FAISS is in-memory + tiny model fits on free tier
    rootDir: backend
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: CHAT_API_KEY
        sync: false      # paste your Groq key manually
      - key: LLM_MODEL
        value: llama-3.3-70b-versatile
      - key: FAISS_INDEX_DIR
        value: ./.faiss_index

  - type: web
    name: rag-frontend
    runtime: python
    plan: free
    rootDir: frontend
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: streamlit run app.py --server.port $PORT --server.address 0.0.0.0 --server.headless true
    envVars:
      - key: BACKEND_URL
        value: https://rag-backend.onrender.com   # update after first backend deploy