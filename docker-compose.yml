services:
  backend:
    build: ./backend
    container_name: rag-backend
    env_file:
      - .env
    environment:
      - PORT=8000
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: rag-frontend
    environment:
      - BACKEND_URL=http://backend:8000
      - PORT=8501
    ports:
      - "8501:8501"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
