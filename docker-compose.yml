services:
  backend:
    build: ./backend
    env_file: .env
    environment:
      DATA_DIR: /data
      HF_HUB_OFFLINE: "1"
    ports:
      - "8000:8000"
    volumes:
      - papertrail-data:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      start_period: 90s
      retries: 5
    restart: unless-stopped
  frontend:
    build: ./frontend
    environment:
      BACKEND_URL: http://backend:8000
    ports:
      - "8501:8501"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
volumes:
  papertrail-data:
